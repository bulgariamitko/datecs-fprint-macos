<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }
        .setting-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-family: Arial, sans-serif;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            margin-top: 15px;
            padding: 10px;
            background-color: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 4px;
            font-size: 12px;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="setting-group">
        <label for="folderName">Път до папката за изтегляне:</label>
        <input type="text" id="folderName" placeholder="напр., datecs-fprint-macos/FPrintWIN/execute">
        <small>Kasa*.txt файловете ще бъдат запазени в Downloads/[път до папка]/</small>
    </div>

    <button id="saveSettings">Запази настройките</button>
    <button id="testDownload" style="background-color: #2196F3; margin-top: 5px;">Тест изтегляне и дебъг</button>

    <div class="info">
        Това разширение автоматично организира kasa*.txt файловете при изтегляне. По подразбиране файловете се запазват в Downloads/datecs-fprint-macos/FPrintWIN/execute/.
    </div>

    <div id="status" class="status" style="display: none;"></div>
    <div id="debugInfo" style="margin-top: 10px; padding: 10px; background-color: #f5f5f5; border-radius: 4px; font-size: 11px; font-family: monospace; white-space: pre-wrap; display: none;"></div>

    <script src="popup.js"></script>
</body>
</html>
